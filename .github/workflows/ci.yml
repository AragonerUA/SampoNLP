name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest pytest-cov numpy tqdm
    
    - name: Build extension
      run: |
        maturin develop --release
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Run tests
      run: pytest tests/ -v --cov=samponlp --cov-report=xml
    
    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Run flake8
      run: flake8 samponlp/ tests/ --max-line-length=100 --ignore=E203,W503 || true
    
    - name: Check black formatting
      run: black --check samponlp/ tests/ || true
    
    - name: Check import sorting
      run: isort --check-only samponlp/ tests/ || true

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install maturin
      run: pip install maturin
    
    - name: Build wheels (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        docker run --rm -v $(pwd):/io ghcr.io/pyo3/maturin build --release --out dist --find-interpreter
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Build wheels (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        maturin build --release --out dist --find-interpreter
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        MACOSX_DEPLOYMENT_TARGET: '10.12'
    
    - name: Build wheels (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        maturin build --release --out dist --find-interpreter
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install maturin
      run: pip install maturin
    
    - name: Build sdist
      run: maturin sdist --out dist
    
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build-wheels, build-sdist]
    if: github.event_name == 'release'
    
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    
    - name: Download sdist
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: sdist
        merge-multiple: true
    
    - name: List distributions
      run: ls -lh dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
