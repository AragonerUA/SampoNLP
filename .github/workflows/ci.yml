name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Create virtual environment (Unix)
      if: runner.os != 'Windows'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
    
    - name: Create virtual environment (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m venv .venv
        .venv\Scripts\Activate.ps1
        echo "VIRTUAL_ENV=$pwd\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$pwd\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest numpy tqdm

    - name: Build and install package
      run: maturin develop --release
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

    - name: Verify installation
      run: python -c "import samponlp; print('Package installed successfully')"

    - name: Run tests
      run: pytest tests/ -v

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Run flake8
      continue-on-error: true
      run: flake8 samponlp/ tests/ --max-line-length=100 --ignore=E203,W503
    
    - name: Check black formatting
      continue-on-error: true
      run: black --check samponlp/ tests/
    
    - name: Check import sorting
      continue-on-error: true
      run: isort --check-only samponlp/ tests/

  build-linux:
    name: Build wheels on Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    strategy:
      matrix:
        target: [x86_64, aarch64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist -i python3.8 -i python3.9 -i python3.10 -i python3.11 -i python3.12
        sccache: 'true'
        manylinux: auto
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-${{ matrix.target }}
        path: dist/*.whl

  build-macos:
    name: Build wheels on macOS (${{ matrix.target }})
    runs-on: macos-latest
    if: github.event_name == 'release'
    strategy:
      matrix:
        target: [x86_64, aarch64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --out dist -i python3.8 -i python3.9 -i python3.10 -i python3.11 -i python3.12
        sccache: 'true'
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        MACOSX_DEPLOYMENT_TARGET: '10.12'
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-${{ matrix.target }}
        path: dist/*.whl

  build-windows:
    name: Build wheels on Windows
    runs-on: windows-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: x64
        args: --release --out dist
        sccache: 'true'
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
    
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows-x64
        path: dist/*.whl

  # Source distribution
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: wheels-sdist
        path: dist/*.tar.gz

  # Publish to PyPI
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build-linux, build-macos, build-windows, build-sdist]
    if: github.event_name == 'release'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    
    - name: List distributions
      run: ls -lh dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
